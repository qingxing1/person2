# 开发环境配置
app:
  prefix: '/api'
  port: 7000
  logger:
    # 项目日志存储路径，相对路径（相对本项目根目录）或绝对路径
    dir: '../logs'
  # 文件相关
  file:
    # location 文件上传后存储目录，相对路径（相对本项目根目录）或绝对路径
    location: '../../upload'
    # 文件服务器地址，这是开发环境的配置 生产环境请自行配置成可访问域名
    domain: 'http://localhost:7000'
    # 文件虚拟路径, 必须以 / 开头， 如 http://localhost:8081/static/****.jpg  , 如果不需要则 设置 ''
    serveRoot: '/static'
# 数据库配置
db:
  mysql:
    host: 'localhost'
    username: 'root'
    password: '123456'
    database: 'kapok'
    port: 3307
    charset: 'utf8mb4'
    logger: false  # 生产环境关闭详细日志
    logging: false
    multipleStatements: true
    dropSchema: false
    synchronize: false  # 生产环境关闭自动同步
    supportBigNumbers: true
    bigNumberStrings: true

# redis 配置
redis:
  host: 'localhost'
  port: 6379
  db: 0
  keyPrefix: 'nest:'

# jwt 配置
jwt:
  secretkey: 'zANDwNQVFzxlfG9myPxVWAkq4iXJEPhI'
  expiresin: '1h'
  refreshExpiresIn: '2h'
# 权限 白名单配置
perm:
  router:
    whitelist:
      - { path: '/api/register', method: 'POST' }
      - { path: '/api/login', method: 'POST' }
      - { path: '/api/perm/{id}', method: 'GET' }
      - { path: '/api/oss/upload', method: 'POST' }
      - { path: '/api/personal', method: 'GET' }
      - { path: '/api/method/list', method: 'GET' }
      - { path: '/api/blog/list', method: 'GET' }
      - { path: '/api/blog/config', method: 'GET' }
      - { path: '/api/blog/config/categories', method: 'GET' }
      - { path: '/api/blog/config/tags', method: 'GET' }
      - { path: '/api/algorithm/problem/config', method: 'GET' }
      - { path: '/api/algorithm/problem/config/categories', method: 'GET' }
      - { path: '/api/message', method: 'POST' }
      - { path: '/api/visit-stats/increment', method: 'POST' }
      - { path: '/api/user/one/info', method: 'GET' }

# 用户相关
# 初始密码， 重置密码
user:
  initialPassword: 'Q123456'
