services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: nest-admin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在根目录 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kapok}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./kapok.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: nest-admin-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - app-network

  # 后端 API 服务
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    image: ${ACR_REGISTRY:-person}/backend:latest
    container_name: nest-admin-backend
    restart: unless-stopped
    environment:
      NODE_ENV: docker
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      APP_PORT: 6999
      UPLOAD_LOCATION: /app/uploads
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${BACKEND_PORT:-6999}:6999"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
    volumes:
      - upload-data:/app/uploads
    healthcheck:
      # node:18-alpine 自带 busybox wget
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:6999/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      # NestJS 启动 + TypeORM 连接较慢, 留出宽限期
      start_period: 30s

  # 管理后台 (Nginx) —— 不再对外发布端口, 由 gateway 内网转发
  admin-frontend:
    build:
      context: .
      dockerfile: packages/admin-frontend/Dockerfile
    image: ${ACR_REGISTRY:-person}/admin-frontend:latest
    container_name: nest-admin-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      # nginx:alpine 自带 busybox wget; 命中静态首页即代表 Nginx worker 已就绪
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # 个人网站 (Nginx) —— 不再对外发布端口, 由 gateway 内网转发
  blog-frontend:
    build:
      context: .
      dockerfile: packages/personal-site/Dockerfile
    image: ${ACR_REGISTRY:-person}/blog-frontend:latest
    container_name: kouzi-blog-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # 统一入口网关 —— 全系统唯一暴露 80/443 的服务
  # TLS 终止 + 按域名分发到 admin-frontend / blog-frontend
  gateway:
    image: nginx:1.31.2-alpine
    container_name: nest-admin-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      # 证书由 scripts/init-ssl.sh 签发到宿主机, 只读挂载
      - ./nginx/certs:/etc/nginx/certs:ro
    # 等待前端容器真正 healthy (Nginx worker 就绪) 后再启动 gateway,
    # 避免 gateway 先于上游起来, 启动瞬间代理解析失败/502
    depends_on:
      admin-frontend:
        condition: service_healthy
      blog-frontend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      # gateway.conf 的 default_server 里有 /healthz 返回 200,
      # 不能用 / (301 会被 wget 跟随到 HTTPS, 误判失败)
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  mysql-data: 
  redis-data: 
  upload-data: 

networks:
  app-network:
    driver: bridge
