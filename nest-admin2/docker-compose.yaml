version: "3.8"

services:
  # Vue.js 管理后台前端
  admin-frontend:
    build:
      context: ../front
      dockerfile: ./Dockerfile
    restart: always
    ports:
      - "9540:9540"
    volumes:
      - upload:/usr/share/nginx/html/static
    depends_on:
      - servers
    networks:
      - app-network

  # React 展示前端
  kouzi-frontend:
    build:
      context: ../kouzi-person
      dockerfile: ./Dockerfile
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - servers
    networks:
      - app-network

  # NestJS 后端服务
  servers:
    build:
      context: ./servers
      dockerfile: ./Dockerfile
    command: npm run start:docker
    restart: always
    ports:
      - "6999:8080"
    volumes:
      - upload:/upload
    environment:
      - NODE_ENV=docker
    depends_on:
      - mysql
      - redis
    networks:
      - app-network

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: '0b3bf6af5250fc69A!'
      MYSQL_DATABASE: 'kapok'
      MYSQL_USER: 'root'
      MYSQL_PASSWORD: '0b3bf6af5250fc69A!'
    volumes:
      - mysql:/var/lib/mysql
      - ./db/kapok.sql:/docker-entrypoint-initdb.d/kapok.sql
    networks:
      - app-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    networks:
      - app-network

  # 数据库管理工具
  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8088:8080"
    networks:
      - app-network

  # Nginx 反向代理（可选）
  nginx-proxy:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - upload:/var/www/upload
    depends_on:
      - admin-frontend
      - kouzi-frontend
      - servers
    networks:
      - app-network

volumes:
  mysql:
  redis:
  upload:

networks:
  app-network:
    driver: bridge
