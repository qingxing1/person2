name: CI/CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: "18"
  PNPM_VERSION: "8.15.0"

jobs:
  # ------------------------------------------------------------
  # 阶段 1: 持续集成 - 安装 / Lint / 测试 / 构建
  # ------------------------------------------------------------
  ci:
    name: Lint / Test / Build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 共享包必须先构建, 否则各应用的 TS 编译找不到产物
      - name: 构建共享包
        run: |
          pnpm --filter @person/shared-types run build
          pnpm --filter @person/shared-utils run build

      - name: Lint 检查
        run: |
          pnpm --filter @person/backend exec eslint "{src,apps,libs,test}/**/*.ts"
          pnpm --filter @person/admin-frontend exec eslint . --ext .vue,.js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts --ignore-path .gitignore

      - name: 后端单元测试 (Jest)
        # 当前仓库暂无 .spec.ts 测试文件, --passWithNoTests 保证后续补充测试后自动生效
        run: pnpm --filter @person/backend exec jest --passWithNoTests

      - name: 管理后台单元测试 (Vitest)
        run: pnpm --filter @person/admin-frontend exec vitest run --environment jsdom --root src/ --passWithNoTests

      - name: 构建后端
        run: pnpm --filter @person/backend run build

      - name: 构建管理后台
        # vue-tsc 1.8 与 TS 5.5+ 存在兼容性问题 (见 admin-frontend/Dockerfile 注释),
        # 与 Dockerfile 保持一致, 跳过类型检查直接 Vite 构建
        run: pnpm --filter @person/admin-frontend run build-only

      - name: 构建个人网站
        # personal-site 的 build 脚本包含 rm -rf, 在 Linux runner 上可直接运行
        run: pnpm --filter @person/personal-site run build

  # ------------------------------------------------------------
  # 阶段 2: rsync 同步代码 + 服务器本地 docker build + compose up
  # (仅 master 分支, 不再经过任何镜像仓库)
  # ------------------------------------------------------------
  deploy:
    name: Rsync & Deploy on Server
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 SSH 密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SERVER_PORT || 22 }} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: rsync 同步代码到服务器
        # --delete 保持服务器目录与仓库一致; --exclude 的文件不受影响
        # .env / 证书 / upload 等服务器本地文件被排除, 不会被覆盖或删除
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT || 22 }}" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '**/node_modules' \
            --exclude '**/dist' \
            --exclude '.env' \
            --include 'nginx/certs/.gitkeep' \
            --exclude 'nginx/certs/*' \
            --exclude 'upload' \
            --exclude 'uploads' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ vars.DEPLOY_DIR }}/

      - name: SSH 在服务器上构建并滚动更新
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_DIR }}

            # 本地构建镜像 (docker-compose.yml 中 image 默认标签为 person/*:latest, 无需仓库)
            docker compose build backend blog-frontend admin-frontend

            # 网关的 Nginx 在证书缺失时会直接启动失败。先判断证书是否就绪,
            # 未就绪就跳过 gateway, 避免首次上线把整条流水线卡死。
            GATEWAY_SVC=""
            if [ -f nginx/certs/fullchain.pem ]; then
              GATEWAY_SVC="gateway"
            else
              echo "提示: nginx/certs/fullchain.pem 不存在, 本次跳过 gateway"
              echo "      在服务器执行 scripts/init-ssl.sh 签发证书后重新部署即可启用 HTTPS"
            fi

            # 滚动更新应用服务 (mysql/redis 不受影响)
            docker compose up -d --no-deps backend blog-frontend admin-frontend $GATEWAY_SVC

            # 网关的 conf / 证书是宿主机挂载进去的, 文件变了容器不会重建,
            # 所以这里显式校验并热重载。nginx -t 不通过就保持旧配置继续服务,
            # 避免一次写错 conf 导致全站 502。
            if [ -n "$GATEWAY_SVC" ]; then
              if docker compose exec -T gateway nginx -t; then
                docker compose exec -T gateway nginx -s reload
                echo "网关配置已重载"
              else
                echo "错误: gateway.conf 校验未通过, 保持旧配置运行"
                exit 1
              fi
            fi

            # 清理悬空镜像 (构建产生的 <none> 中间层)
            docker image prune -f

            # 健康检查: 等待后端就绪 (最多 60 秒)
            backend_ok=0
            for i in $(seq 1 12); do
              if curl -fsS http://localhost:${BACKEND_PORT:-6999}/api/health > /dev/null 2>&1; then
                echo "后端服务健康检查通过"
                backend_ok=1
                break
              fi
              echo "等待后端启动... ($i/12)"
              sleep 5
            done

            if [ "$backend_ok" != "1" ]; then
              echo "警告: 健康检查未通过, 请人工确认服务状态"
              docker compose logs --tail=50 backend
              exit 1
            fi

            # HTTPS 冒烟检查 —— 网关未启用或证书异常时只告警, 不阻塞部署
            if [ -n "$GATEWAY_SVC" ]; then
              if curl -fsS --resolve www.ztcyj.club:443:127.0.0.1 \
                   https://www.ztcyj.club/api/health > /dev/null 2>&1; then
                echo "HTTPS 网关检查通过 (www.ztcyj.club)"
              else
                echo "警告: HTTPS 检查失败, 请检查 gateway 容器与证书链"
                docker compose logs --tail=30 gateway
              fi
            fi

      - name: 部署结果通知
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "部署成功: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "部署失败, 请检查工作流日志"
          fi
