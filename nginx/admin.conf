# 管理后台容器内部 Nginx。
# 本容器不对外发布端口, 只接受 nginx/gateway.conf 的内网转发,
# 因此这里的 listen 80 是容器内端口, 不涉及宿主机 443 端口争抢。
server {
    listen 80;
    server_name admin.ztcyj.club;

    root /usr/share/nginx/html;
    index index.html;

    # 后台文件上传上限, 与 .env 的 UPLOAD_MAX_SIZE / gateway.conf 保持一致。
    # 两跳 Nginx 都要放开, 只放开其中一跳仍会返回 413。
    client_max_body_size 50m;

    access_log /var/log/nginx/admin.access.log;
    error_log /var/log/nginx/admin.error.log;

    # 前端路由 - 支持 Vue Router 的 history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端容器
    location /api/ {
        proxy_pass http://backend:6999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 透传网关写入的真实客户端 IP, 不要用 $remote_addr (那是网关容器 IP)
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 透传网关写入的真实协议, 不要用 $scheme (这一跳恒为 http)
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # /static/ 根目录下的文件为后端 oss 上传的文件（文件名含哈希，无子目录）。
    # 必须放在下方静态资源正则 location 之前，否则会被 try_files 拦截返回 404。
    # 注意不能整体代理 /static/，因为本前端自身构建产物位于 /static/js、/static/css 等子目录。
    location ~* ^/static/[^/]+$ {
        alias /home/ubuntu/persion2/packages/backend/uploads/
        proxy_pass http://backend:6999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 透传网关写入的真实客户端 IP, 不要用 $remote_addr (那是网关容器 IP)
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 透传网关写入的真实协议, 不要用 $scheme (这一跳恒为 http)
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 后端上传的博客图片（封面/正文，数据库中存的是相对路径 /static/blog/...）
    # 用 ^~ 确保 .jpg 等后缀的正则 location 不会抢先命中
    location ^~ /static/blog/ {
        proxy_pass http://backend:6999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 透传网关写入的真实客户端 IP, 不要用 $remote_addr (那是网关容器 IP)
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 透传网关写入的真实协议, 不要用 $scheme (这一跳恒为 http)
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml font/woff font/woff2 image/svg+xml;
}
