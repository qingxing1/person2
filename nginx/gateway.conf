# ============================================================
# 统一入口网关 —— TLS 终止 + 域名分发
# ------------------------------------------------------------
# 本容器是整个系统唯一对宿主机暴露 80/443 的服务。
# admin-frontend / blog-frontend / backend 只在 app-network 内网互通,
# 不再向宿主机发布端口 (见 docker-compose.yml), 因此 443 端口
# 不会被多个 Nginx 争抢。
#
# 域名规划 —— 本文件是唯一配置点, 换域名只需改这里 + 做 DNS 解析:
#   https://www.zecyj.club    -> blog-frontend:80   (个人网站)
#   https://admin.zecyj.club  -> admin-frontend:80  (管理后台)
#   https://zecyj.club        -> 301 到 www
#   http 以下任意 Host        -> 301 到对应 https
#
# 证书由 scripts/init-ssl.sh 通过 acme.sh + DNSPod DNS API 签发,
# 安装到宿主机 ./nginx/certs/ 后以只读方式挂载进本容器。
# acme.sh 的续期 cron 会自动 reload 本容器, 无需人工介入。
# ============================================================

upstream blog_frontend {
    server blog-frontend:80;
    keepalive 16;
}

upstream admin_frontend {
    server admin-frontend:80;
    keepalive 16;
}

# ------------------------------------------------------------
# HTTP : 只负责跳转到 HTTPS
# 证书走 DNS 验证, 不需要留 80 端口给 ACME challenge
# ------------------------------------------------------------

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # 裸域名与未知 Host 一律收敛到主站
    return 301 https://www.zecyj.club$request_uri;
}

server {
    listen      80;
    listen      [::]:80;
    server_name www.zecyj.club admin.zecyj.club;

    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------
# HTTPS : 个人网站
# ------------------------------------------------------------

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.zecyj.club zecyj.club;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 注意: nginx 不允许同一级上下文重复定义这些指令,
    # 所以下面两个 https server 块各自写了一份, 修改时请同步。
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS: 有效期 6 个月。确认全站 HTTPS 稳定后再考虑加 preload
    add_header Strict-Transport-Security "max-age=15552000" always;

    # 后台上传/博客封面最大 50m, 与 .env 的 UPLOAD_MAX_SIZE 对齐。
    # 网关和前端 Nginx 两跳都要放开, 否则大文件会 413。
    client_max_body_size 50m;

    # 容器日志直接进 docker logs
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # 裸域名收敛到 www
    if ($host = zecyj.club) {
        return 301 https://www.zecyj.club$request_uri;
    }

    location / {
        proxy_pass http://blog_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 网关到前端容器是 http, 必须显式告诉后端真实协议,
        # 否则后端生成的绝对地址会是 http://
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# ------------------------------------------------------------
# HTTPS : 管理后台
# ------------------------------------------------------------

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name admin.zecyj.club;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    add_header Strict-Transport-Security "max-age=15552000" always;

    # 后台不希望被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 50m;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location / {
        proxy_pass http://admin_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
