# ============================================================
# 统一入口网关 —— TLS 终止 + 域名分发
# ------------------------------------------------------------
# 本容器是整个系统唯一对宿主机暴露 80/443 的服务。
# admin-frontend / blog-frontend / backend 只在 app-network 内网互通,
# 不再向宿主机发布端口 (见 docker-compose.yml), 因此 443 端口
# 不会被多个 Nginx 争抢。
#
# 域名规划 —— 本文件是唯一配置点, 换域名只需改这里 + 做 DNS 解析:
#   https://ztcyj.club        -> blog-frontend:80   (个人网站, 主站)
#   https://admin.ztcyj.club  -> admin-frontend:80  (管理后台)
#   https://www.ztcyj.club    -> 301 到裸域名
#   http 以下任意 Host        -> 301 到对应 https
#
# 证书由 scripts/init-ssl.sh 通过 acme.sh + DNSPod DNS API 签发,
# 安装到宿主机 ./nginx/certs/ 后以只读方式挂载进本容器。
# acme.sh 的续期 cron 会自动 reload 本容器, 无需人工介入。
# ============================================================

# ------------------------------------------------------------
# 上游解析: 使用 Docker 内嵌 DNS (127.0.0.11) + 变量式 proxy_pass
#
# 不用 upstream 静态块的原因: upstream 里的域名在 Nginx 启动时
# 一次性解析, 如果此刻 blog-frontend 容器还没注册进 Docker DNS,
# Nginx 会直接启动失败退出 (host not found in upstream)。
# 变量式 proxy_pass 把解析推迟到每个请求到来时, 并配合 resolver
# 做缓存与刷新 —— 上游暂时不存在只会得到 502, 不会拖垮网关本身。
#
# 代价: 失去 upstream 块的 keepalive 连接池。网关到前端是同宿主
# 内网, 建连开销可忽略。
# ------------------------------------------------------------
resolver 127.0.0.11 valid=30s ipv6=off;
resolver_timeout 5s;

# ------------------------------------------------------------
# HTTP : 只负责跳转到 HTTPS
# 证书走 DNS 验证, 不需要留 80 端口给 ACME challenge
# ------------------------------------------------------------

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # 容器健康检查专用 (docker-compose healthcheck / CI 冒烟)
    # 必须放在 return 301 之前, 且不能被 301 逻辑捕获
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # www 与未知 Host 一律收敛到主站裸域名
    return 301 https://ztcyj.club$request_uri;
}

server {
    listen      80;
    listen      [::]:80;
    server_name admin.ztcyj.club;

    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------
# HTTPS : 个人网站
# ------------------------------------------------------------

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name ztcyj.club;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 注意: nginx 不允许同一级上下文重复定义这些指令,
    # 所以下面两个 https server 块各自写了一份, 修改时请同步。
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS: 有效期 6 个月。确认全站 HTTPS 稳定后再考虑加 preload
    add_header Strict-Transport-Security "max-age=15552000" always;

    # 后台上传/博客封面最大 50m, 与 .env 的 UPLOAD_MAX_SIZE 对齐。
    # 网关和前端 Nginx 两跳都要放开, 否则大文件会 413。
    client_max_body_size 50m;

    # 容器日志直接进 docker logs
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # www 收敛到裸域名
    if ($host = www.ztcyj.club) {
        return 301 https://ztcyj.club$request_uri;
    }

    location / {
        # 变量式 proxy_pass: 解析推迟到请求时, 走上面的 resolver。
        # 注意: 含变量时 proxy_pass 不能带 URI 部分, 路径原样透传。
        set $blog_upstream http://blog-frontend:80;
        proxy_pass $blog_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 网关到前端容器是 http, 必须显式告诉后端真实协议,
        # 否则后端生成的绝对地址会是 http://
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# ------------------------------------------------------------
# HTTPS : 管理后台
# ------------------------------------------------------------

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name admin.ztcyj.club;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    add_header Strict-Transport-Security "max-age=15552000" always;

    # 后台不希望被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 50m;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location / {
        set $admin_upstream http://admin-frontend:80;
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
