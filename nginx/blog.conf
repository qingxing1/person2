# 个人网站容器内部 Nginx。
# 本容器不对外发布端口, 只接受 nginx/gateway.conf 的内网转发,
# 因此这里的 listen 80 是容器内端口, 不涉及宿主机 443 端口争抢。
server {
    listen 80;
    server_name www.zecyj.club;

    root /usr/share/nginx/html;
    index index.html;

    # 留言/上传上限, 与 gateway.conf 保持一致。两跳都要放开, 否则 413。
    client_max_body_size 50m;

    access_log /var/log/nginx/blog.access.log;
    error_log /var/log/nginx/blog.error.log;

    # nginx 默认限制请求体 1MB，后端允许封面上传 5MB、markdown 上传 50MB/个（批量最多 50 个）
    client_max_body_size 200m;

    # 前端路由 - 支持 React Router 的 history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端容器
    location /api/ {
        proxy_pass http://backend:6999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 透传网关写入的真实客户端 IP, 不要用 $remote_addr (那是网关容器 IP)
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 透传网关写入的真实协议, 不要用 $scheme (这一跳恒为 http)
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 后端上传的图片（数据库中存的是相对路径 /static/...），转发给后端容器
    # 用 ^~ 确保 .jpg 等后缀的正则 location 不会抢先命中
    location ^~ /static/ {
        alias /home/ubuntu/persion2/packages/backend/uploads/
        proxy_pass http://backend:6999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 透传网关写入的真实客户端 IP, 不要用 $remote_addr (那是网关容器 IP)
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 透传网关写入的真实协议, 不要用 $scheme (这一跳恒为 http)
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 静态资源缓存（vite 产物带 hash，可长缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml font/woff font/woff2 image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
